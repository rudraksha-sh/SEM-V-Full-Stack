<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section h2{
            color:blue;
        }
        section>h2{
            color:green;
        }
        h2~p{
            color:red;
            font-weight:bold;
        }
        h2+p+p{
            color:violet;
        }
    </style>
</head>
<body>
    <section>
        <h2> Heading 1</h2>
        <p>Para 1</p>
        <p>Para 2</p>
        <div>
        <h2> Heading 2</h2>
        </div>
    </section>
    
</body>
</html>
