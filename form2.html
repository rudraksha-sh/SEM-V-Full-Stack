<html>
<head>
    <title>My Webpage</title>
    <style>
        input {
            font-size: 16px;
            border: 2px solid rgb(162, 203, 27);
            border-radius: 20px;
            padding: 8px;
        }
        input:enabled {
            background-color: white;
        }
        input:disabled {
            background-color: lightgray;
            cursor: not-allowed;
        }
        input:valid {
            color: green;
        }
        input:invalid {
            color: red;
        }
        input:required {
            font-family: Arial;
        }
        input:optional {
            font-style: italic;
        }
        input:in-range {
            border: 2px solid green;
        }
        input:out-of-range {
            border: 2px solid red;
        }
        input:read-only {
            background-color: lightgray;
        }
        input:read-write {
            background-color: white;
        }
        input:placeholder-shown {
            border: 2px solid orange;
        }
        input:checked {
            accent-color: green;
        }
    </style>
</head>
<body>
    <form>
        <input type="text"placeholder="First Name"required><br><br>
        <input type="text"placeholder="Middle Name"><br><br>
        <input type="text"placeholder="Last Name"required><br><br>
        <input type="email"placeholder="Email" required><br><br>
        <input type="number" placeholder="Age" min="18" max="25"><br><br>
        <input type="text" value="Rudraksha Sharma"readonly> <br><br>
        <input type="text" value="Disabled Input" disabled> <br><br>
        <input type="checkbox" id="agree">
        <label for="agree">I agree</label> <br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
